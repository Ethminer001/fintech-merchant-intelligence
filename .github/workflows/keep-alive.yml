name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */8 * * *"   # every 8 hours; the app sleeps after 12 hours without traffic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (uses the Chrome already on the runner)
        run: npm install --no-save playwright-core@1.48.2
      - name: Visit the app
        run: node .github/keepalive.js
        env:
          APP_URL: https://fintech-merchant-intelligence-astcmpgnb72vpycszmzfir.streamlit.app/
